<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Kantor Kita</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="auth">
    <div class="auth-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><circle cx="8" cy="8" r="3.2"/><circle cx="16.5" cy="8.5" r="2.7"/><path d="M2 19c0-3.6 2.7-6 6-6s6 2.4 6 6v1H2z"/><path d="M15 20v-1c0-2-.6-3.7-1.7-5 .9-.6 2-1 3.2-1 3 0 5.5 2.2 5.5 5.5V20z"/></svg></span><div><strong>Kantor Kita</strong><span>A virtual office for real teamwork</span></div></div>
    <p id="inviteNote" class="auth-invite" hidden></p>
    <div class="auth-tabs" role="tablist" aria-label="Account">
      <button type="button" role="tab" id="tabLogin" aria-selected="true" aria-controls="loginForm">Sign in</button>
      <button type="button" role="tab" id="tabSignup" aria-selected="false" aria-controls="signupForm">Create account</button>
    </div>
    <form id="loginForm" role="tabpanel" aria-labelledby="tabLogin">
      <label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email" required maxlength="200">
      <label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required maxlength="200">
      <button type="submit" class="primary">Sign in</button>
    </form>
    <form id="signupForm" role="tabpanel" aria-labelledby="tabSignup" hidden>
      <label for="signupName">Your name</label><input id="signupName" autocomplete="name" required maxlength="80">
      <label for="signupEmail">Email</label><input id="signupEmail" type="email" autocomplete="email" required maxlength="200">
      <label for="signupPassword">Password <span>(at least 8 characters)</span></label><input id="signupPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="200">
      <div id="workspaceField"><label for="signupWorkspace">Workspace name</label><input id="signupWorkspace" maxlength="80" placeholder="Your company or team"></div>
      <button type="submit" class="primary">Create account</button>
    </form>
    <p id="authFeedback" role="alert"></p>
  </main>
  <script src="login.js"></script>
</body>
</html>
